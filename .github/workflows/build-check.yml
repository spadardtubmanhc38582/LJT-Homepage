name: Build check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Install UglifyJS
        run: npm install -g uglify-js
      - name: Minify JS files
        run: uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js
      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - name: Verify homepage content
        run: |
          grep -q 'SynLogic' _site/index.html
          grep -q 'SynLogic' _site/publications/index.html
          grep -q 'jliugi@connect.ust.hk' _site/index.html
          grep -q '/LJT-Homepage/publications/' _site/index.html
      - name: List generated site files
        run: find _site -maxdepth 2 -type f | sort
